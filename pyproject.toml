[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quanticdata-website-technology-checker"
version = "0.1.0"
description = "Website technology checker for Python and the command line: CMS, e-commerce platform, frameworks, analytics, ad pixels, payments, chat and CDN of any website, plus WordPress theme and plugins and GA4, GTM and Meta Pixel ids, as JSON or CSV. Free and open source; sign in with your QuanticData account, no browser extension or proxies needed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "QuanticData", email = "hello@quanticdata.io" }]
keywords = ["website-technology-checker", "tech-stack", "technology-lookup", "technology-detection", "website-analyzer", "cms-detector", "wordpress-detector", "shopify-detector", "lead-generation", "sales-intelligence", "web-scraping", "python"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]

[project.scripts]
tech-checker = "quanticdata_website_technology_checker.__main__:run"

[project.urls]
Homepage = "https://quanticdata.io/collectors/technology-lookup-api/?utm_source=github&utm_medium=pypi&utm_campaign=website-technology-checker"
Documentation = "https://quanticdata.io/docs/"
Source = "https://github.com/quantumproxies/website-technology-checker"
Issues = "https://github.com/quantumproxies/website-technology-checker/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quanticdata_website_technology_checker" = ["spec.json", "py.typed"]
